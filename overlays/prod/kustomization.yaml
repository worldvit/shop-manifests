apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-prod
resources:
  - ../../base
labels:
  - pairs: { env: prod }
replicas:
  - { name: frontend, count: 3 }
  - { name: product-api, count: 3 }
  - { name: order-api, count: 3 }
# 이미지 주소와 태그 — Jenkins(또는 set-images.sh)가 이 아래 값만 고쳐 커밋한다
images:
  - name: shop/frontend
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/shop/frontend
    newTag: "initial"
  - name: shop/product-api
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/shop/product-api
    newTag: "initial"
  - name: shop/order-api
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/shop/order-api
    newTag: "initial"
