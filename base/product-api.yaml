apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  labels: { app: product-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-api }
  template:
    metadata:
      labels: { app: product-api }
    spec:
      containers:
        - name: product-api
          image: shop/product-api            # 실제 주소·태그는 overlay의 images가 정한다
          ports: [{ containerPort: 5000 }]
          readinessProbe:           # 준비되기 전에는 Service 트래픽을 받지 않음
            httpGet: { path: /api/products/health, port: 5000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: product-api
spec:
  selector: { app: product-api }
  ports: [{ port: 5000, targetPort: 5000 }]
